name: Build Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP archive not found"
            ls -la
            exit 1
          fi
          mkdir extracted
          unzip -q "$ARCHIVE" -d extracted
          SETTINGS_FILE="$(find extracted -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APK_PATH=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Patch app source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_project.py "$PROJECT_DIR"

      - name: Inspect Compose sources
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -name '*.kt' -print
          while IFS= read -r file; do
            case "$file" in
              *LukyanovskyApp.kt|*Screens.kt|*Theme.kt|*Color.kt|*Settings*|*NotebookScreen.kt|*strings.xml|*AndroidManifest.xml|*MainActivity.kt)
                echo "===== $file ====="
                sed -n '1,700p' "$file"
                ;;
            esac
          done < <(find "$PROJECT_DIR" -type f -name '*.kt' | sort)
          echo "===== PILL DEFINITIONS ====="
          grep -R -n -E 'fun Pill|Pill\(' "$PROJECT_DIR" --include='*.kt' || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lukyanovsky-kach-debug-signing-key-v1

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lukyanovsky-Kach-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
